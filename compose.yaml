name: clip-tribune
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tribune
      POSTGRES_PASSWORD: tribune_local
      POSTGRES_DB: tribune
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribune -d tribune"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:63799:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
